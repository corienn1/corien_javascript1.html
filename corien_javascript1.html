<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-6">
            Student Grade Checker
        </h1>
        <label class="block mb-2">Student Name</label>
        <input
            type="text"
            id="name"
            class="w-full border rounded-lg p-3 mb-4"
            placeholder="Enter Your Name">
        <label class="block mb-2">Exam Score</label>
        <input
            type="number"
            id="score"
            min="0"
            max="100"
            class="w-full border rounded-lg p-3 mb-4"
            placeholder="Enter Score (0-100)">
        <button
            onclick="chechGrade()"
            class="w-full bg-indigo-600 text-white p-3 rounded-lg hover:bg-indigo-700">Check Grade</button>
        <div id="result" class="mt-6 text-center">                </div>    
    </div>
</body>

</body>
</html>
